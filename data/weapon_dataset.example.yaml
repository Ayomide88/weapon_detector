# Example Ultralytics dataset config for fine-tuning YOLOv8 on weapons.
# Point `path` at your dataset root (YOLO format: images/ + labels/).
# Datasets: Roboflow Universe ("weapon detection"), Kaggle, or a custom set
# annotated with LabelImg / Roboflow.

path: datasets/weapons        # dataset root directory
train: images/train           # train images (relative to `path`)
val: images/val               # validation images (relative to `path`)
test: images/test             # optional test images

# Class names -> indices. Keep these consistent with your label .txt files.
names:
  0: pistol
  1: rifle
  2: knife
  3: handgun
