[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weapon-detector"
version = "0.1.0"
description = "Real-time weapon detection and alert system using YOLOv8"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.1,<9",
    "opencv-python>=4.8",
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "twilio>=8.0",
    "plyer>=2.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
# Optional file-based alarm playback (falls back to terminal bell if absent).
sound = ["playsound==1.2.2"]

[project.scripts]
weapon-detector = "weapon_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
packages = ["weapon_detector"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false

# The GUI is thin Tkinter/Pillow glue with runtime-only widget imports that the
# type checker cannot resolve precisely; it is exercised manually, not by mypy.
[[tool.mypy.overrides]]
module = "weapon_detector.gui"
ignore_errors = true
